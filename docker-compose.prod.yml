services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: bunkerstroy-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bunker_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bunker_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-bunkerstroy_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bunker_user} -d ${POSTGRES_DB:-bunkerstroy_db}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bunkerstroy-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bunkerstroy-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-bunker_user}:${POSTGRES_PASSWORD:-bunker_secret_pass}@postgres:5432/${POSTGRES_DB:-bunkerstroy_db}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-bunker_enterprise_super_secret_jwt_key_2026_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-bunker_refresh_super_secret_jwt_key_2026_production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3000:3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: bunkerstroy-web
    restart: always
    ports:
      - '4000:80'

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: bunkerstroy-admin
    restart: always
    ports:
      - '4050:80'

  gateway:
    image: nginx:1.27-alpine
    container_name: bunkerstroy-gateway
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
      - admin

volumes:
  postgres_data:
  redis_data:
