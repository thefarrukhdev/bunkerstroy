name: BunkerStroy Mobile Build (Android & iOS)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Platform & Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.2

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install

      - name: Build Types Package
        run: pnpm --filter @bunkerstroy/types build

      - name: Build Web Application
        run: pnpm --filter @bunkerstroy/web build

      - name: Capacitor Sync Android
        run: |
          pnpm --filter @bunkerstroy/web cap:sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        run: |
          cd apps/web/android
          chmod +x gradlew
          if ! ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/android_gradle.log; then
            echo "::error file=build.gradle::Build failed! Printing last 20 lines:"
            tail -n 20 /tmp/android_gradle.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Locate and inspect APK files
        run: |
          echo "=== Found APKs ==="
          find apps/web/android/app/build/outputs/apk -type f -name "*.apk" || true
          mkdir -p "${GITHUB_WORKSPACE}/apk-output"
          cp $(find apps/web/android/app/build/outputs/apk -type f -name "*.apk") "${GITHUB_WORKSPACE}/apk-output/BunkerStroy-Android-debug.apk" || true

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BunkerStroy-Android-Debug-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/develop'
        with:
          tag_name: mobile-latest
          name: BunkerStroy Mobile Build (Latest)
          draft: false
          prerelease: false
          files: apk-output/*.apk

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.2

      - name: Install Dependencies
        run: pnpm install

      - name: Build Types Package
        run: pnpm --filter @bunkerstroy/types build

      - name: Build Web Application
        run: pnpm --filter @bunkerstroy/web build

      - name: Capacitor Sync iOS
        run: |
          pnpm --filter @bunkerstroy/web cap:sync ios

      - name: Build iOS Application (Simulator & Archive)
        run: |
          cd apps/web/ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -quiet

      - name: Compress iOS App Bundle
        run: |
          cd apps/web/ios/App
          DERIVED_DATA=$(xcodebuild -project App.xcodeproj -scheme App -showBuildSettings | grep -m 1 "BUILD_DIR" | grep -oEi "\/.*")
          APP_PATH="${DERIVED_DATA}/Debug-iphonesimulator/App.app"
          if [ -d "$APP_PATH" ]; then
            cd "${DERIVED_DATA}/Debug-iphonesimulator"
            zip -r BunkerStroy-iOS-Simulator.zip App.app
            mkdir -p "${GITHUB_WORKSPACE}/ios-output"
            mv BunkerStroy-iOS-Simulator.zip "${GITHUB_WORKSPACE}/ios-output/"
          else
            echo "Fallback zip source"
            mkdir -p "${GITHUB_WORKSPACE}/ios-output"
            zip -r "${GITHUB_WORKSPACE}/ios-output/BunkerStroy-iOS-Source.zip" .
          fi

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BunkerStroy-iOS-App
          path: ios-output/*.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Publish iOS to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/develop'
        with:
          tag_name: mobile-latest
          name: BunkerStroy Mobile Build (Latest)
          draft: false
          prerelease: false
          files: ios-output/*.zip
