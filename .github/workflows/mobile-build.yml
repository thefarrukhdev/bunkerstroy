name: BunkerStroy Mobile Build (Android & iOS)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment & Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.2

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install

      - name: Build Types Package
        run: pnpm --filter @bunkerstroy/types build

      - name: Build Web Application
        run: pnpm --filter @bunkerstroy/web build

      - name: Capacitor Sync Android
        run: |
          cd apps/web
          npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        run: |
          cd apps/web/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/android-build.log || (echo "=== GRADLE BUILD FAILURE LOG ==="; tail -n 120 /tmp/android-build.log; exit 1)

      - name: Upload Build Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Failure-Log
          path: /tmp/android-build.log
          retention-days: 7

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: BunkerStroy-Android-Debug-APK
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.2

      - name: Install Dependencies
        run: pnpm install

      - name: Build Types Package
        run: pnpm --filter @bunkerstroy/types build

      - name: Build Web Application
        run: pnpm --filter @bunkerstroy/web build

      - name: Capacitor Sync iOS
        run: |
          cd apps/web
          npx cap sync ios

      - name: Build iOS Application (Simulator & Archive)
        run: |
          cd apps/web/ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -quiet

      - name: Compress iOS App Bundle
        run: |
          cd apps/web/ios/App
          DERIVED_DATA=$(xcodebuild -project App.xcodeproj -scheme App -showBuildSettings | grep -m 1 "BUILD_DIR" | grep -oEi "\/.*")
          APP_PATH="${DERIVED_DATA}/Debug-iphonesimulator/App.app"
          if [ -d "$APP_PATH" ]; then
            cd "${DERIVED_DATA}/Debug-iphonesimulator"
            zip -r BunkerStroy-iOS-Simulator.zip App.app
            mkdir -p "${GITHUB_WORKSPACE}/ios-output"
            mv BunkerStroy-iOS-Simulator.zip "${GITHUB_WORKSPACE}/ios-output/"
          else
            echo "Fallback zip source"
            mkdir -p "${GITHUB_WORKSPACE}/ios-output"
            zip -r "${GITHUB_WORKSPACE}/ios-output/BunkerStroy-iOS-Source.zip" .
          fi

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BunkerStroy-iOS-App
          path: ios-output/*.zip
          if-no-files-found: warn
          retention-days: 14
