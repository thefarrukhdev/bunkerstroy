name: BunkerStroy Mobile Build (Android & iOS)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.2

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install

      - name: Build Types Package
        run: pnpm --filter @bunkerstroy/types build

      - name: Build Web Application
        run: pnpm --filter @bunkerstroy/web build

      - name: Capacitor Sync Android
        run: |
          cd apps/web
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd apps/web/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: BunkerStroy-Android-Debug-APK
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.2

      - name: Install Dependencies
        run: pnpm install

      - name: Build Types Package
        run: pnpm --filter @bunkerstroy/types build

      - name: Build Web Application
        run: pnpm --filter @bunkerstroy/web build

      - name: Capacitor Sync iOS
        run: |
          cd apps/web
          npx cap sync ios

      - name: Build iOS Application (Simulator & Archive)
        run: |
          cd apps/web/ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -quiet

      - name: Compress iOS App Bundle
        run: |
          cd apps/web/ios/App
          DERIVED_DATA=$(xcodebuild -workspace App.xcworkspace -scheme App -showBuildSettings | grep -m 1 "BUILD_DIR" | grep -oEi "\/.*")
          APP_PATH="${DERIVED_DATA}/Debug-iphonesimulator/App.app"
          if [ -d "$APP_PATH" ]; then
            cd "${DERIVED_DATA}/Debug-iphonesimulator"
            zip -r BunkerStroy-iOS-Simulator.zip App.app
          else
            echo "Fallback archive"
            zip -r BunkerStroy-iOS-Source.zip .
          fi

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BunkerStroy-iOS-App
          path: apps/web/ios/App/**/*.zip
          if-no-files-found: warn
          retention-days: 14
